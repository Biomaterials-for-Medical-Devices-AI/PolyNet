# =============================================================================
# PolyNet Experiment Configuration
# =============================================================================
# Edit this file to describe your experiment. Then run:
#
#   python scripts/run_pipeline.py --config configs/experiment.yaml
#
# All paths are relative to the project root unless they start with /

# -----------------------------------------------------------------------------
# Experiment metadata
# -----------------------------------------------------------------------------
experiment:
  name: "my_polymer_experiment"
  output_dir: "results"   # all outputs written here
  random_seed: 42

# -----------------------------------------------------------------------------
# Data
# By default this template uses the built-in Tg benchmark: 7,367 homopolymers
# (PSMILES) with experimental glass transition temperatures (K) from the curated
# dataset of polymetrix (Zenodo record 15210035). It is downloaded on first use
# and cached, so no file is needed. To use your own data instead, remove
# benchmark_dataset and set data_path to your CSV file (give one of the two).
# -----------------------------------------------------------------------------
data:
  data_name: "curated_tg.csv"       # name used for files written to output_dir
  benchmark_dataset: "curated_tg"   # built-in dataset (columns: ID, PSMILES, Tg(K))
  # data_path: "data/my_polymers.csv"   # your CSV file (instead of benchmark_dataset)
  smiles_cols: ["PSMILES"]          # one column per monomer
  canonicalise_smiles: true
  target_variable_col: "Tg(K)"      # column to predict
  problem_type: "regression"        # "regression" or "classification"
  string_representation: "psmiles"  # smiles | psmiles
  id_col: "ID"                      # unique sample identifier column
  num_classes: 1                    # 1 for regression, N for N-class classification
  target_variable_name: "Tg"        # human-readable name (used in plots)
  target_variable_units: "K"

  # For classification only — maps class labels to display names, e.g.
  # class_names: {"0": "Inactive", "1": "Active"}
  class_names: null

# -----------------------------------------------------------------------------
# Representations
# -----------------------------------------------------------------------------
representations:

  # How per-monomer representations are combined into one polymer representation:
  # weighted_average (needs weights_col) | concatenate | no_merging (single monomer column)
  smiles_merge_approach: "no_merging"

  # --- Graph representation (for GNN models) ---
  # allowable_vals lists the one-hot categories; wildcard: true adds an "other" bucket.
  node_features:
    GetAtomicNum:
      allowable_vals: [6, 7, 8, 9, 14, 15, 16, 17, 35]   # C N O F Si P S Cl Br
      wildcard: true
    GetTotalNumHs:
      allowable_vals: [0, 1, 2, 3]
      wildcard: true
    GetIsAromatic:
      allowable_vals: [true, false]
      wildcard: false
    IsAttachmentPoint: {}            # PSMILES: drop [*] atoms, flag the atoms bonded to them
  edge_features:
    GetBondTypeAsDouble:
      allowable_vals: [1.0, 1.5, 2.0, 3.0]
      wildcard: true

  # --- Vector descriptors (for TML models) ---
  molecular_descriptors: {
    "rdkit": "all",    # all RDKit descriptors (or a list of names)
    "morgan": true,    # Morgan count fingerprints (defaults: fp_size 2048, radius 3), or
    # "morgan": {"fp_size": 1024, "radius": 2},
    # "rdkitfp": {"fp_size": 2048},
    # "polybert": true,          # polyBERT embedding (downloads the model on first use)
    # "polymetrix": {            # PolyMetriX descriptors, e.g.
    #   "side_chain": ["num_rotatable_bonds", "num_rings", "molecular_weight"],
    #   "backbone": ["num_rotatable_bonds", "num_rings", "molecular_weight"],
    #   "agg": ["sum", "mean"]
    # },
  }

  # Map each SMILES column to its ratio (weight fraction) column for copolymers,
  # e.g. {smiles_monomer_1: ratio_1, smiles_monomer_2: ratio_2}. null for homopolymers.
  weights_col: null

# -----------------------------------------------------------------------------
# Data splitting
# -----------------------------------------------------------------------------
splitting:
  split_type: "train_val_test"     # the only implemented split type
  split_method: "random"           # random | stratified (by target; recommended for classification)
  train_set_balance: null
  test_ratio: 0.15                 # fraction of the full dataset
  val_ratio: 0.15                  # fraction of the full dataset (→ 70/15/15 split)
  n_bootstrap_iterations: 2        # number of repeated train/val/test splits ("bootstraps")

  # astartes sampler drawing the sets (astartes default hyperparameters):
  # random | kennard_stone | spxy | kmeans | optisim | target_property
  sampler: "random"
  # Fingerprint samplers (kennard_stone, spxy, kmeans, optisim) place each polymer by
  # the ratio-weighted average of its monomers' fingerprints. Used for splitting only —
  # it does not change the representations. Defaults: morgan, 2048, radius 3.
  # sampling_fingerprint:
  #   fingerprint: "morgan"          # morgan | rdkitfp | polybert
  #   fp_size: 2048                  # morgan / rdkitfp only
  #   radius: 3                      # morgan only

  # Optional: balance imbalanced binary classification data by undersampling the
  # majority class to this minority proportion. Training and validation are each
  # balanced after the split, the test set keeps the original distribution
  # (ACS Appl. Mater. Interfaces 2023, 15 (11), 14155–14163). Use with
  # split_method: stratified to keep the train:validation proportion.
  # train_set_balance: 0.5

# -----------------------------------------------------------------------------
# GNN models
# GNN architectures to train. Set hyperparameters explicitly,
# or leave the block empty ({}) to trigger automatic HPO via Ray Tune.
# -----------------------------------------------------------------------------
gnn_training:
  train_gnn: true
  gnn_convolutional_layers:
    GCN:
      LearningRate: 0.001
      BatchSize: 32
      improved: false
      embedding_dim: 64
      n_convolutions: 3
      readout_layers: 2
      dropout: 0.1
      pooling: "global_mean_pool"

    # GAT:
    #   LearningRate: 0.001
    #   BatchSize: 32
    #   num_heads: 4
    #   embedding_dim: 64
    #   n_convolutions: 3
    #   readout_layers: 2
    #   dropout: 0.1

    # CGGNN:
    #   LearningRate: 0.001
    #   BatchSize: 32
    #   embedding_dim: 64
    #   n_convolutions: 3
    #   readout_layers: 2
    #   dropout: 0.1

    # MPNN: {}   # empty = trigger HPO

  # Optional: automatic HPO sample count and custom search candidates (only used for
  # architectures with an empty block, {}). A listed parameter replaces the default
  # candidates; unlisted parameters keep their defaults. See docs/configuration.md.
  # hpo_num_samples: 50
  # hpo_search_grid:
  #   shared: {embedding_dim: [64, 128], LearningRate: [0.001, 0.01]}
  #   GAT: {num_heads: [2, 4, 8]}

  # Optional: optimiser, learning-rate scheduler and loss for every GNN (final training
  # and HPO trials). Defaults shown; see docs/configuration.md for all options.
  # optimisation:
  #   optimizer: adam                    # adam | sgd | rmsprop | adadelta | adagrad
  #   scheduler: reduce_lr_on_plateau    # reduce_lr_on_plateau | step_lr | multi_step_lr | exponential_lr
  #   scheduler_factor: 0.9
  #   scheduler_patience: 15             # reduce_lr_on_plateau only
  #   scheduler_min_lr: 1.0e-8           # reduce_lr_on_plateau only
  #   regression_loss: rmse              # rmse | mse | mae

training:
  epochs: 250

# -----------------------------------------------------------------------------
# Target scaling (regression only)
# The target is scaled for training (fitted on the training samples of each split)
# and predictions are transformed back, so reported values and metrics stay in the
# original units. Recommended for targets far from 0, such as Tg in K.
# -----------------------------------------------------------------------------
target_transform:
  strategy: "standard_scaler"   # no_transformation | standard_scaler | min_max_scaler | robust_scaler | log10 | log1p

# -----------------------------------------------------------------------------
# Feature preprocessing (pipeline-wide)
# The scaler applies to every tabular feature: the molecular descriptors of the
# TML models AND the representations.polymer_descriptors concatenated to the GNN
# graph embedding. It is fitted on the training set of each split.
# Selectors (feature selection) apply to TML models only.
# Only needed when TML models are trained or GNNs use polymer_descriptors.
# -----------------------------------------------------------------------------
feature_preprocessing:
  scaler: "standard_scaler"   # no_transformation | standard_scaler | min_max_scaler | robust_scaler | power_transformer | quantile_transformer | normalizer
  selectors:
    variance:
      threshold: 0.05
    correlation:
      threshold: 0.95

# -----------------------------------------------------------------------------
# TML models
# Traditional ML models trained on descriptor vectors.
# Only active when representations.descriptors.enabled is true.
# Leave the block empty ({}) to trigger randomised-search HPO (RandomizedSearchCV,
# hpo_num_samples configurations (default 50), hpo_n_folds-fold shuffled CV).
# -----------------------------------------------------------------------------
tml_models:
  train_tml: true
  # true (default): TML models (and their feature scaling and HPO) use the training +
  # validation samples. false: training samples only, the same data GNNs train on;
  # the validation samples are scored as a held-out validation set.
  include_validation_in_training: true
  hpo_n_folds: 5   # CV folds for automatic HPO (>= 2; <= smallest class size for classification)
  # hpo_num_samples: 50          # configurations sampled per search (RandomizedSearchCV n_iter)
  # hpo_search_grid:             # custom candidates for models with an empty block ({})
  #   random_forest: {n_estimators: [200, 500], max_depth: [null, 10]}

  selected_models:
    random_forest:
      n_estimators: 200
      max_depth: 10

    xgboost:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.05

    # SupportVectorMachine: {}   # empty = trigger HPO

# -----------------------------------------------------------------------------
# Explainability
# Only applied to GNN models. Requires gnn_training.train_gnn: true
# Uses chemistry-masking attribution (substructure masking; Wu et al., Nat. Commun.
# 14, 2585 (2023), https://doi.org/10.1038/s41467-023-38192-3):
#   attribution(fragment) = Y_pred_full − Y_pred_masked
# -----------------------------------------------------------------------------
explainability:
  enabled: false
  algorithm: "chemistry_masking"

  # Which GNN architectures to explain.
  # Must match keys in gnn_training.gnn_convolutional_layers (e.g. GCN, GAT).
  # "all" explains every trained architecture.
  models: "all"
  # models: [GCN, GAT]

  # Which splits to explain, numbered from 1 like the model files (GCN_1, GCN_2, ...).
  # "all" explains every trained split.
  # Combined with models as a cross-product:
  #   models: [GCN, GAT] + bootstraps: [1, 3]  →  GCN_1, GCN_3, GAT_1, GAT_3
  bootstraps: "all"
  # bootstraps: [1, 2]

  # Molecular fragmentation strategy.
  fragmentation: "brics"             # brics | murcko_scaffold

  # Data split to draw molecules from for the global distribution plot.
  explain_set: "test"                # train | validation | test | all

  # Normalisation applied to attribution scores before plotting.
  normalisation: "per_model"         # local | global | per_model | no_normalisation

  # For classification: which class to attribute (null for regression).
  target_class: null

  # Attribution distribution plot style.
  plot_type: "ridge"                 # ridge | bar | strip

  # Show only the top-N and bottom-N fragments by mean attribution.
  # null shows every fragment.
  top_n: 10

  # Molecule IDs to generate per-molecule heatmaps and attribution tables for.
  # When null (default), the local explanation step is skipped entirely.
  local_explain_mol_ids: null
  # local_explain_mol_ids:
  #   - "poly_0001"

# -----------------------------------------------------------------------------
# TML SHAP Explainability
# Requires tml_models.train_tml: true and descriptor representations.
# -----------------------------------------------------------------------------
tml_explainability:
  enabled: false

  # TML model types to explain, e.g. [RandomForest, XGBoost].
  # "all" explains every trained TML model type.
  models: "all"

  # Descriptor representations to explain, e.g. [morgan, rdkit].
  # "all" explains every trained descriptor.
  representations: "all"

  # Splits to explain, numbered from 1 like the model files (e.g. random_forest-rdkit_1).
  # "all" explains every trained split.
  bootstraps: "all"

  # Data split to draw samples from for the global distribution plot.
  # With tml_models.include_validation_in_training: true (default) TML models are
  # trained on train + validation, so "validation" (and "all") explain training
  # data; use "test" for unseen samples.
  explain_set: "test"              # train | validation | test | all

  # Normalisation applied to SHAP scores before plotting.
  normalisation: "per_model"       # local | global | per_model | no_normalisation

  # For classification: which class to attribute (null for regression).
  target_class: null

  # Global SHAP summary plot style (native shap package).
  plot_type: "beeswarm"            # beeswarm | bar | violin

  # Show only the top-N features by mean |SHAP|.
  # null shows all features.
  top_n: 10

  # Sample IDs to generate per-instance waterfall/force plots for.
  # When null (default), the local explanation step is skipped entirely.
  local_explain_sample_ids: null
  # local_explain_sample_ids:
  #   - "poly_0001"

  # Plot style for per-instance SHAP explanations.
  local_plot_type: "waterfall"     # waterfall | force | bar